<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Commit Counter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    padding:40px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:#111827;
    border-radius:10px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
    border:1px solid #334155;
}

h1{
    margin-bottom:25px;
    color:#f8fafc;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

input, select{
    padding:10px;
    border:1px solid #475569;
    border-radius:6px;
    font-size:15px;
    background:#0b1220;
    color:#e5e7eb;
}

input[type="date"]{
    min-width:150px;
}

.date-group{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
    min-width:320px;
    padding:8px 10px;
    background:#0b1220;
    border:1px solid #475569;
    border-radius:6px;
}

.date-select{
    min-width:90px;
    flex:1 1 90px;
    background:#111827;
    border:1px solid #334155;
    color:#e5e7eb;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    padding:10px 16px;
}

button:hover{
    background:#1d4ed8;
}

.repo-toolbar{
    position:sticky;
    top:0;
    z-index:3;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
    padding:8px 0;
    background:#111827;
}

.repo-toolbar input{
    flex:1 1 240px;
    min-width:180px;
}

.repo-toolbar select{
    flex:1 1 240px;
    min-width:180px;
}

.repo-toolbar button{
    flex:0 0 auto;
}


#summary{
    font-size:20px;
    margin:20px 0;
    font-weight:bold;
}

.table-wrap{
    max-height:60vh;
    overflow:auto;
    border:1px solid #334155;
    border-radius:10px;
    width:100%;
    background:#0b1220;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:separate;
    border-spacing:0;
}

thead{
    background:#1e293b;
    color:#f8fafc;
}

thead th{
    position:sticky;
    top:0;
    z-index:1;
    background:#1e293b;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:12px 14px;
    text-align:left;
    border-bottom:1px solid #334155;
}

th,td{
    border-right:1px solid #334155;
    padding:12px 14px;
    text-align:left;
    color:#e5e7eb;
    vertical-align:top;
}

th:last-child, td:last-child{
    border-right:none;
}

tbody td{
    background:#0f172a;
    border-bottom:1px solid #243145;
}

tbody tr:nth-child(even) td{
    background:#111c32;
}

tbody tr:hover td{
    background:#172554;
}

.message{
    max-width:520px;
    white-space:normal;
    word-break:break-word;
}

.loading{
    color:#0066cc;
}

.error{
    color:red;
}
</style>

</head>

<body>

<div class="container">

<h1>GitHub Commit Counter</h1>

<div class="form">

<div class="repo-toolbar">
    <input
    id="owner"
    placeholder="GitHub Owner (e.g. microsoft)"
    onkeydown="if(event.key === 'Enter'){ loadRepos(); }">

    <button onclick="loadRepos()">
    Load Repos
    </button>

    <select id="repoSelect" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); loadCommits(); }">
        <option value="">Select a repository</option>
    </select>

    <div class="date-group">
        <select id="sinceDay" class="date-select" title="Day">
            <option value="">Day</option>
        </select>
        <select id="sinceMonth" class="date-select" title="Month">
            <option value="">Month</option>
        </select>
        <select id="sinceYear" class="date-select" title="Year">
            <option value="">Year</option>
        </select>
    </div>

    <div class="date-group">
        <select id="untilDay" class="date-select" title="Day">
            <option value="">Day</option>
        </select>
        <select id="untilMonth" class="date-select" title="Month">
            <option value="">Month</option>
        </select>
        <select id="untilYear" class="date-select" title="Year">
            <option value="">Year</option>
        </select>
    </div>

    <button onclick="loadCommits()">
    Search
    </button>
</div>

<div id="summary"></div>

<div class="table-wrap">
    <table>

    <thead>

    <tr>
    <th>#</th>
    <th>SHA</th>
    <th>Author</th>
    <th>Date</th>
    <th>Message</th>
    </tr>

    </thead>

    <tbody id="tableBody">

    </tbody>

    </table>
</div>

</div>

<script>

function populateDateDropdowns(){
    const daySelects=[document.getElementById("sinceDay"),document.getElementById("untilDay")];
    const monthSelects=[document.getElementById("sinceMonth"),document.getElementById("untilMonth")];
    const yearSelects=[document.getElementById("sinceYear"),document.getElementById("untilYear")];
    const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const currentYear=new Date().getFullYear();

    for(const select of daySelects){
        for(let i=1;i<=31;i++){
            const option=document.createElement("option");
            option.value=String(i).padStart(2,"0");
            option.textContent=String(i).padStart(2,"0");
            select.appendChild(option);
        }
    }

    for(const select of monthSelects){
        months.forEach((month,index)=>{
            const option=document.createElement("option");
            option.value=String(index+1).padStart(2,"0");
            option.textContent=month;
            select.appendChild(option);
        });
    }

    for(const select of yearSelects){
        for(let year=currentYear-5;year<=currentYear;year++){
            const option=document.createElement("option");
            option.value=String(year);
            option.textContent=String(year);
            select.appendChild(option);
        }
    }
}

function buildDateString(day,month,year){
    if(!day || !month || !year){
        return "";
    }

    return `${year}-${month}-${day}`;
}

populateDateDropdowns();

async function loadRepos(){

const owner=document.getElementById("owner").value.trim();

if(!owner){
    alert("Please enter the GitHub owner.");
    return;
}

const repoSelect=document.getElementById("repoSelect");
repoSelect.innerHTML='<option value="">Loading repositories...</option>';

document.getElementById("summary").innerHTML="";

try{
    const response=await fetch(`http://localhost:5000/api/repos?owner=${encodeURIComponent(owner)}`);
    const data=await response.json();

    if(!response.ok){
        throw new Error(data.error || "Server error.");
    }

    repoSelect.innerHTML='';
    const defaultOption=document.createElement("option");
    defaultOption.value="";
    defaultOption.textContent=`Choose one of ${data.total} repositories`;
    repoSelect.appendChild(defaultOption);

    data.repos.forEach((repo)=>{
        const option=document.createElement("option");
        option.value=repo.name;
        option.textContent=repo.name;
        repoSelect.appendChild(option);
    });

}catch(error){
    repoSelect.innerHTML='<option value="">No repositories found</option>';
    document.getElementById("summary").innerHTML=`<span class="error">${error.message}</span>`;
}

}

async function loadCommits(){

const owner=document.getElementById("owner").value.trim();
const repo=document.getElementById("repoSelect").value;
const sinceDay=document.getElementById("sinceDay").value;
const sinceMonth=document.getElementById("sinceMonth").value;
const sinceYear=document.getElementById("sinceYear").value;
const untilDay=document.getElementById("untilDay").value;
const untilMonth=document.getElementById("untilMonth").value;
const untilYear=document.getElementById("untilYear").value;
const since=buildDateString(sinceDay,sinceMonth,sinceYear);
const until=buildDateString(untilDay,untilMonth,untilYear);

if(!owner || !repo){
    alert("Please enter the GitHub owner and choose a repository.");
    return;
}

const table=document.getElementById("tableBody");
table.innerHTML="";

document.getElementById("summary").innerHTML=
"<span class='loading'>Loading...</span>";

try{

const params=new URLSearchParams();

params.append("owner",owner);
params.append("repo",repo);

if(since)
    params.append("since",since+"T00:00:00Z");

if(until)
    params.append("until",until+"T23:59:59Z");

const response=await fetch(
`http://localhost:5000/api/commits?${params.toString()}`
);

const data=await response.json();

if(!response.ok){
    throw new Error(data.error || "Server error.");
}

document.getElementById("summary").innerHTML=
`Total Commits: ${data.total}`;

data.commits.forEach((commit,index)=>{

const row=document.createElement("tr");

row.innerHTML=`

<td>${index+1}</td>

<td>${commit.sha}</td>

<td>${commit.author}</td>

<td>${new Date(commit.date).toLocaleString()}</td>

<td class="message">${commit.message}</td>

`;

table.appendChild(row);

});

if(data.total===0){

table.innerHTML=
"<tr><td colspan='5'>No commits found.</td></tr>";

}

}catch(error){

document.getElementById("summary").innerHTML=
`<span class="error">${error.message}</span>`;

}

}

</script>

</body>

</html>
