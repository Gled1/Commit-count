<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GitHub Commit Counter</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#0f172a;
    color:#e5e7eb;
    padding:40px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:#111827;
    border-radius:10px;
    padding:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.4);
    border:1px solid #334155;
}

h1{
    margin-bottom:25px;
    color:#f8fafc;
}

.form{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:15px;
    margin-bottom:20px;
}

input, select{
    padding:10px;
    border:1px solid #475569;
    border-radius:6px;
    font-size:15px;
    background:#0b1220;
    color:#e5e7eb;
}

input[type="date"]{
    min-width:150px;
}

.date-field{
    position:relative;
    min-width:320px;
}

.date-input-button{
    width:100%;
    padding:10px 12px;
    border:1px solid #475569;
    border-radius:6px;
    background:#0b1220;
    color:#e5e7eb;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.calendar-popup{
    position:absolute;
    top:calc(100% + 8px);
    left:0;
    min-width:320px;
    padding:12px;
    border:1px solid #334155;
    border-radius:10px;
    background:#111827;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    z-index:5;
}

.calendar-toolbar,
.calendar-weekdays,
.calendar-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.calendar-toolbar{
    align-items:center;
    margin-bottom:10px;
}

.calendar-toolbar select{
    width:100%;
    min-width:0;
}

.calendar-weekdays span,
.calendar-day,
.nav-btn{
    text-align:center;
    font-size:13px;
}

.calendar-weekdays span{
    color:#94a3b8;
    padding:4px 0;
}

.calendar-day,
.nav-btn{
    border:1px solid #334155;
    border-radius:6px;
    background:#0b1220;
    color:#e5e7eb;
    cursor:pointer;
    padding:8px 0;
}

.calendar-day:hover,
.nav-btn:hover,
.date-input-button:hover{
    background:#172554;
}

.calendar-day.selected{
    background:#2563eb;
    border-color:#2563eb;
}

.calendar-day.empty{
    visibility:hidden;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    padding:10px 16px;
}

button:hover{
    background:#1d4ed8;
}

.repo-toolbar{
    position:sticky;
    top:0;
    z-index:3;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
    padding:8px 0;
    background:#111827;
}

.repo-toolbar input{
    flex:1 1 240px;
    min-width:180px;
}

.repo-toolbar select{
    flex:1 1 240px;
    min-width:180px;
}

.repo-toolbar button{
    flex:0 0 auto;
}


#summary{
    font-size:20px;
    margin:20px 0;
    font-weight:bold;
}

.table-wrap{
    border:1px solid #334155;
    border-radius:10px;
    width:100%;
    background:#0b1220;
}

table{
    width:100%;
    min-width:900px;
    border-collapse:separate;
    border-spacing:0;
}

.pagination{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    padding:12px;
    border-top:1px solid #334155;
    background:#111827;
}

.pagination button{
    padding:8px 12px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    cursor:pointer;
}

.pagination button:disabled{
    opacity:0.5;
    cursor:not-allowed;
}

thead{
    background:#1e293b;
    color:#f8fafc;
}

thead th{
    position:sticky;
    top:0;
    z-index:1;
    background:#1e293b;
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    padding:12px 14px;
    text-align:left;
    border-bottom:1px solid #334155;
}

th,td{
    border-right:1px solid #334155;
    padding:12px 14px;
    text-align:left;
    color:#e5e7eb;
    vertical-align:top;
}

th:last-child, td:last-child{
    border-right:none;
}

tbody td{
    background:#0f172a;
    border-bottom:1px solid #243145;
}

tbody tr:nth-child(even) td{
    background:#111c32;
}

tbody tr:hover td{
    background:#172554;
}

.message{
    max-width:520px;
    white-space:normal;
    word-break:break-word;
}

.loading{
    color:#0066cc;
}

.error{
    color:red;
}
</style>

</head>

<body>

<div class="container">

<h1>GitHub Commit Counter</h1>

<div class="form">

<div class="repo-toolbar">
    <input
    id="owner"
    placeholder="GitHub Owner (e.g. microsoft)"
    onkeydown="if(event.key === 'Enter'){ loadRepos(); }">

    <button onclick="loadRepos()">
    Load Repos
    </button>

    <select id="repoSelect" onkeydown="if(event.key === 'Enter'){ event.preventDefault(); loadCommits(); }">
        <option value="">Select a repository</option>
    </select>

    <input
    id="repoName"
    placeholder="Or enter repo name"
    onkeydown="if(event.key === 'Enter'){ loadCommits(); }">

    <div class="date-field">
        <button type="button" class="date-input-button" id="sinceButton">Select start date</button>
        <div class="calendar-popup" id="sinceCalendar" hidden>
            <div class="calendar-toolbar">
                <button type="button" class="nav-btn" data-target="since" data-action="prev">◀</button>
                <select id="sinceMonthSelect"></select>
                <select id="sinceYearSelect"></select>
                <button type="button" class="nav-btn" data-target="since" data-action="next">▶</button>
            </div>
            <div class="calendar-weekdays">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="calendar-grid" id="sinceGrid"></div>
        </div>
    </div>

    <div class="date-field">
        <button type="button" class="date-input-button" id="untilButton">Select end date</button>
        <div class="calendar-popup" id="untilCalendar" hidden>
            <div class="calendar-toolbar">
                <button type="button" class="nav-btn" data-target="until" data-action="prev">◀</button>
                <select id="untilMonthSelect"></select>
                <select id="untilYearSelect"></select>
                <button type="button" class="nav-btn" data-target="until" data-action="next">▶</button>
            </div>
            <div class="calendar-weekdays">
                <span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span>
            </div>
            <div class="calendar-grid" id="untilGrid"></div>
        </div>
    </div>

    <button onclick="loadCommits()">
    Search
    </button>
</div>

<div id="summary"></div>

<div class="table-wrap">
    <table>

    <thead>

    <tr>
    <th>#</th>
    <th>SHA</th>
    <th>Author</th>
    <th>Date</th>
    <th>Message</th>
    </tr>

    </thead>

    <tbody id="tableBody">

    </tbody>

    </table>
    <div class="pagination" id="pagination"></div>
</div>

</div>

<script>

const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const state={
    since:{month:new Date().getMonth(), year:new Date().getFullYear(), selectedDate:""},
    until:{month:new Date().getMonth(), year:new Date().getFullYear(), selectedDate:""},
    page:1,
    pageSize:10,
    allCommits:[]
};

function initCalendarControls(){
    const monthSelects=[document.getElementById("sinceMonthSelect"),document.getElementById("untilMonthSelect")];
    const yearSelects=[document.getElementById("sinceYearSelect"),document.getElementById("untilYearSelect")];
    const yearStart=new Date().getFullYear()-5;
    const yearEnd=new Date().getFullYear()+5;

    monthSelects.forEach((select,index)=>{
        months.forEach((month,idx)=>{
            const option=document.createElement("option");
            option.value=idx;
            option.textContent=month;
            select.appendChild(option);
        });
        select.addEventListener("change",()=>{
            const target=index===0?"since":"until";
            state[target].month=parseInt(select.value,10);
            renderCalendar(target);
        });
    });

    yearSelects.forEach((select,index)=>{
        for(let year=yearStart;year<=yearEnd;year++){
            const option=document.createElement("option");
            option.value=year;
            option.textContent=year;
            select.appendChild(option);
        }
        select.addEventListener("change",()=>{
            const target=index===0?"since":"until";
            state[target].year=parseInt(select.value,10);
            renderCalendar(target);
        });
    });

    document.getElementById("sinceButton").addEventListener("click",()=>toggleCalendar("since"));
    document.getElementById("untilButton").addEventListener("click",()=>toggleCalendar("until"));

    document.querySelectorAll(".nav-btn").forEach((btn)=>{
        btn.addEventListener("click",()=>{
            const target=btn.dataset.target;
            const action=btn.dataset.action;
            if(action==="prev"){
                if(state[target].month===0){
                    state[target].month=11;
                    state[target].year--;
                }else{
                    state[target].month--;
                }
            }else{
                if(state[target].month===11){
                    state[target].month=0;
                    state[target].year++;
                }else{
                    state[target].month++;
                }
            }
            renderCalendar(target);
        });
    });
}

function toggleCalendar(target){
    const popup=document.getElementById(`${target}Calendar`);
    popup.hidden=!popup.hidden;
}

function renderCalendar(target){
    const monthSelect=document.getElementById(`${target}MonthSelect`);
    const yearSelect=document.getElementById(`${target}YearSelect`);
    const grid=document.getElementById(`${target}Grid`);
    const button=document.getElementById(`${target}Button`);

    monthSelect.value=state[target].month;
    yearSelect.value=state[target].year;

    const firstDay=new Date(state[target].year,state[target].month,1);
    const daysInMonth=new Date(state[target].year,state[target].month+1,0).getDate();
    const leadingEmpty=firstDay.getDay();

    grid.innerHTML="";

    for(let i=0;i<leadingEmpty;i++){
        const empty=document.createElement("div");
        empty.className="calendar-day empty";
        grid.appendChild(empty);
    }

    for(let day=1;day<=daysInMonth;day++){
        const cell=document.createElement("button");
        cell.type="button";
        cell.className="calendar-day";
        cell.textContent=day;
        const isoDate=`${state[target].year}-${String(state[target].month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
        if(state[target].selectedDate===isoDate){
            cell.classList.add("selected");
        }
        cell.addEventListener("click",()=>{
            state[target].selectedDate=isoDate;
            button.textContent=isoDate;
            renderCalendar(target);
            document.getElementById(`${target}Calendar`).hidden=true;
        });
        grid.appendChild(cell);
    }
}

initCalendarControls();
renderCalendar("since");
renderCalendar("until");

function buildDateString(day,month,year){
    if(!day || !month || !year){
        return "";
    }

    return `${year}-${month}-${day}`;
}

async function loadRepos(){

const owner=document.getElementById("owner").value.trim();

if(!owner){
    alert("Please enter the GitHub owner.");
    return;
}

const repoSelect=document.getElementById("repoSelect");
repoSelect.innerHTML='<option value="">Loading repositories...</option>';

document.getElementById("summary").innerHTML="";

try{
    const response=await fetch(`http://localhost:5000/api/repos?owner=${encodeURIComponent(owner)}`);
    const data=await response.json();

    if(!response.ok){
        throw new Error(data.error || "Server error.");
    }

    repoSelect.innerHTML='';
    const defaultOption=document.createElement("option");
    defaultOption.value="";
    defaultOption.textContent=`Choose one of ${data.total} repositories`;
    repoSelect.appendChild(defaultOption);

    data.repos.forEach((repo)=>{
        const option=document.createElement("option");
        option.value=repo.name;
        option.textContent=repo.name;
        repoSelect.appendChild(option);
    });

}catch(error){
    repoSelect.innerHTML='<option value="">No repositories found</option>';
    document.getElementById("summary").innerHTML=`<span class="error">${error.message}</span>`;
}

}

function renderPage(){
    const table=document.getElementById("tableBody");
    const pagination=document.getElementById("pagination");
    const totalPages=Math.max(1, Math.ceil(state.allCommits.length / state.pageSize));

    if(state.allCommits.length===0){
        table.innerHTML="<tr><td colspan='5'>No commits found.</td></tr>";
        pagination.innerHTML="";
        return;
    }

    const start=(state.page-1)*state.pageSize;
    const end=start+state.pageSize;
    const pageItems=state.allCommits.slice(start,end);

    table.innerHTML="";
    pageItems.forEach((commit,index)=>{
        const row=document.createElement("tr");
        row.innerHTML=`
            <td>${start+index+1}</td>
            <td>${commit.sha}</td>
            <td>${commit.author}</td>
            <td>${new Date(commit.date).toLocaleString()}</td>
            <td class="message">${commit.message}</td>
        `;
        table.appendChild(row);
    });

    pagination.innerHTML="";
    const prevBtn=document.createElement("button");
    prevBtn.textContent="Prev";
    prevBtn.disabled=state.page===1;
    prevBtn.addEventListener("click",()=>{
        if(state.page>1){
            state.page--;
            renderPage();
        }
    });
    pagination.appendChild(prevBtn);

    const pageInfo=document.createElement("span");
    pageInfo.textContent=`Page ${state.page} of ${totalPages}`;
    pagination.appendChild(pageInfo);

    const nextBtn=document.createElement("button");
    nextBtn.textContent="Next";
    nextBtn.disabled=state.page===totalPages;
    nextBtn.addEventListener("click",()=>{
        if(state.page<totalPages){
            state.page++;
            renderPage();
        }
    });
    pagination.appendChild(nextBtn);
}

async function loadCommits(){

const owner=document.getElementById("owner").value.trim();
const repo=document.getElementById("repoSelect").value;
const repoName=document.getElementById("repoName").value.trim();
const since=state.since.selectedDate;
const until=state.until.selectedDate;

state.page=1;
state.allCommits=[];

let resolvedOwner=owner;
let resolvedRepo=repo;

if(!resolvedOwner && !resolvedRepo && !repoName){
    alert("Please enter a GitHub owner or repository name.");
    return;
}

if(!resolvedRepo && repoName){
    if(resolvedOwner){
        resolvedRepo=repoName;
    }else{
        const resolveResponse=await fetch(`http://localhost:5000/api/resolve-repo?repo=${encodeURIComponent(repoName)}`);
        const resolveData=await resolveResponse.json();

        if(!resolveResponse.ok){
            throw new Error(resolveData.error || "Could not resolve repository.");
        }

        resolvedOwner=resolveData.owner;
        resolvedRepo=resolveData.repo;
    }
}

const table=document.getElementById("tableBody");
table.innerHTML="";

document.getElementById("summary").innerHTML=
"<span class='loading'>Loading...</span>";

try{

const params=new URLSearchParams();
params.append("owner",resolvedOwner);

if(since)
    params.append("since",since+"T00:00:00Z");

if(until)
    params.append("until",until+"T23:59:59Z");

let response;
let data;
let contributionData={total:0};

if(resolvedRepo){
    params.append("repo",resolvedRepo);
    response=await fetch(`http://localhost:5000/api/commits?${params.toString()}`);
    data=await response.json();

    if(!response.ok){
        throw new Error(data.error || "Server error.");
    }

    const contributionsResponse=await fetch(
        `http://localhost:5000/api/contributions?owner=${encodeURIComponent(resolvedOwner)}&repo=${encodeURIComponent(resolvedRepo)}&since=${encodeURIComponent(since ? since+"T00:00:00Z" : "")}&until=${encodeURIComponent(until ? until+"T23:59:59Z" : "")}`
    );
    contributionData=await contributionsResponse.json();

    if(!contributionsResponse.ok){
        throw new Error(contributionData.error || "Failed to fetch contributions.");
    }

    state.allCommits=data.commits || [];
    document.getElementById("summary").innerHTML=
        `Total Commits: ${data.total} | Contributions in Range: ${contributionData.total}`;
    renderPage();
}else{
    response=await fetch(`http://localhost:5000/api/repos/commits?${params.toString()}`);
    data=await response.json();

    if(!response.ok){
        throw new Error(data.error || "Server error.");
    }

    state.allCommits=[];
    document.getElementById("summary").innerHTML=
        `Total Commits Across All Repos: ${data.total}`;
    table.innerHTML=`<tr><td colspan='5'>Showing aggregate totals for ${data.repos.length} repositories.</td></tr>`;
    document.getElementById("pagination").innerHTML="";
}

}catch(error){
    document.getElementById("summary").innerHTML=
        `<span class="error">${error.message}</span>`;
}

}

</script>

</body>

</html>
